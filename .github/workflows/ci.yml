# CI for the app repo checkout. The unit suite runs here — its bootstrap
# uses OCP stubs only (no Nextcloud DB needed), see tests/bootstrap.php.
#
# What does NOT run here (needs a live Nextcloud instance + seeded data):
#   - tests/Integration and the Playwright e2e specs (tests/e2e/*.spec.js)
#     → run via `npm run e2e` against the dev stack, plus the workspace
#       gate scripts (contracts, screenshot matrix, shared-pack sync).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: find lib tests templates -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: info.xml parses and version bounds are sane
        run: php -r '$x=simplexml_load_file("appinfo/info.xml") or exit(1); if (!$x->id || !$x->version) exit(2);'

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite unit --colors=never
